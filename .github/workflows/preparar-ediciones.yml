name: Preparar ediciones

on:
  push:
    branches: [main]
    paths:
      - 'ediciones/**'
      - 'scripts/preparar-ediciones.py'
      - '.github/workflows/preparar-ediciones.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preparar-ediciones
  cancel-in-progress: false

jobs:
  borradores:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener las fichas de las ediciones
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Crear los borradores pendientes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/preparar-ediciones.py
